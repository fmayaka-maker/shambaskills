<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShambaSkills KNPCBA</title>
<script src="pdf.js" defer></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6b3a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: phone-first single column; deep-green header band with segmented role tabs; content as soft elevated cards; each workflow a numbered stepper */
  --bg:#f4f2ea; --bg2:#ebe7da; --surface:#ffffff; --ink:#17251b; --muted:#5b6a5e; --line:#dcd8c9;
  --accent:#1f6b3a; --accent-2:#2f8a4e; --accent-soft:#e3efe4; --on-accent:#ffffff;
  --gold:#d99a1e; --gold-soft:#fbefd2;
  --good:#1e6f30; --good-soft:#e1f1e3; --warn:#7a4a00; --warn-soft:#f8ecd2; --bad:#b0281f; --bad-soft:#f8e1de;
  --shadow:0 1px 2px rgba(23,37,27,.06),0 8px 24px rgba(23,37,27,.07);
  --shadow-lg:0 2px 4px rgba(23,37,27,.08),0 16px 40px rgba(23,37,27,.12);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101611; --bg2:#151d16; --surface:#1a231c; --ink:#e6ece4; --muted:#a3b0a5; --line:#2f3b31;
    --accent:#7fcb8f; --accent-2:#9fdcab; --accent-soft:#1f3423; --on-accent:#0d1e10;
    --gold:#f0bd52; --gold-soft:#3a2f17;
    --good:#86c993; --good-soft:#1f3420; --warn:#e3b05e; --warn-soft:#382d18; --bad:#f2928a; --bad-soft:#3b211f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body{background:radial-gradient(1200px 500px at 50% -200px,var(--bg2),var(--bg) 70%) fixed}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.45rem} h2{font-size:1.2rem} h3{font-size:1.03rem} h4{font-size:.95rem}
p{margin:0}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 32px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.wrap>*,main>*,.card>*{min-width:0}
header.top{position:relative;overflow:hidden;background:linear-gradient(135deg,#174f2b 0%,#1f6b3a 45%,#2f8a4e 100%);color:#fff;padding:16px 18px 12px;border-radius:0 0 24px 24px;display:grid;gap:12px;margin:0 -16px;box-shadow:var(--shadow-lg)}
header.top::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 180px at 90% -40px,rgba(255,214,120,.28),transparent 70%),repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);pointer-events:none}
header.top>*{position:relative}
.brand{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand .who{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 3px rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.2)}
.brand h1{color:#fff;font-size:1.5rem}
.brand h1::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.brand small{opacity:.88;font-size:.82rem;display:block;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.95);color:#2a3a2e}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#8a978c}
.pill.ok .dot{background:#2fa04a;box-shadow:0 0 0 3px rgba(47,160,74,.2)} .pill.wait .dot{background:var(--gold)} .pill.off .dot{background:var(--bad)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:rgba(0,0,0,.18);padding:4px;border-radius:14px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:rgba(255,255,255,.88);font-weight:700;font-size:.92rem;padding:8px 14px;border-radius:10px;transition:background .15s,color .15s}
nav.tabs a:hover{background:rgba(255,255,255,.1);color:#fff}
nav.tabs a[aria-current="page"]{background:#fff;color:#1f6b3a;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.card>h2:first-child,.card>.row>h2:first-child{display:flex;align-items:center;gap:8px}
.card>h2:first-child::before{content:"";width:6px;height:22px;border-radius:3px;background:linear-gradient(var(--accent),var(--gold))}
.muted{color:var(--muted)} .small{font-size:.88rem}
.tag.crit{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:.74rem;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:#6b4500;letter-spacing:.02em}
label{font-weight:600;display:block}
input[type=password],input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent-2);box-shadow:0 0 0 4px var(--accent-soft);outline:none}
textarea{min-height:90px;resize:vertical}
.field{display:grid;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
button,.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;padding:10px 18px;border:1.5px solid transparent;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--on-accent);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 4px 12px rgba(31,107,58,.25);transition:transform .12s,box-shadow .12s,background .15s}
button:hover:not(:disabled),.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(31,107,58,.3)}
button:active:not(:disabled){transform:translateY(0)}
button.ghost,.btn.ghost{background:var(--surface);color:var(--accent);border-color:var(--line);box-shadow:none}
button.ghost:hover:not(:disabled),.btn.ghost:hover{border-color:var(--accent-2);background:var(--accent-soft);box-shadow:none}
header.top button.ghost{background:rgba(255,255,255,.12)!important;color:#fff!important;border-color:rgba(255,255,255,.4)!important}
button.sm{padding:5px 11px;font-size:.86rem;border-radius:10px}
button.pill{background:rgba(255,255,255,.95);color:#2a3a2e;box-shadow:none;border:none;padding:4px 11px;font-size:.78rem}
button.pill:hover:not(:disabled){transform:none;box-shadow:none;background:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;padding:4px 0}
.check input{margin-top:4px;width:19px;height:19px;flex:0 0 auto;accent-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:var(--shadow);overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.tile b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.tile span{color:var(--muted);font-size:.84rem}
.scroll{overflow-x:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}
th{font-size:.76rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--bg)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.status{font-weight:800;font-size:.76rem;padding:3px 10px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.status.green{background:var(--good-soft);color:var(--good)} .status.red{background:var(--bad-soft);color:var(--bad)} .status.grey{background:var(--bg);color:var(--muted)} .status.amber{background:var(--warn-soft);color:var(--warn)}
.prog{display:inline-block;width:96px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;vertical-align:middle;margin-right:6px}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
/* KNP header block */
.knp{border:1.5px solid var(--ink);outline:4px double var(--line);outline-offset:-8px;border-radius:14px;padding:16px 12px;text-align:center;display:grid;gap:2px;background:var(--surface)}
.knp img{width:58px;height:58px;margin:0 auto 6px;border-radius:50%;background:#fff}
.knp b{font-family:var(--display);letter-spacing:.02em}
.knp u{font-weight:700;text-underline-offset:3px}
/* stepper */
.stepper{display:flex;gap:5px;flex-wrap:wrap}
.stepper span{flex:1 1 18px;height:8px;border-radius:99px;background:var(--line);transition:background .2s}
.stepper span.done{background:var(--accent)} .stepper span.now{background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.stepcard{border-left:6px solid var(--accent)}
.stepno{font-family:var(--display);font-size:.8rem;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
ol.how{margin:0;padding-left:1.4em;display:grid;gap:6px}
ol.how li::marker{color:var(--accent);font-weight:800}
.safe{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:700;border-left:4px solid var(--bad)}
.timer{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:1.05rem;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px}
.timer:empty{display:none}
.timer.over{color:var(--bad);background:var(--bad-soft)}
.palist{display:grid;gap:10px}
.pacard{position:relative;display:grid;gap:4px;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px 14px 20px;font-weight:400;box-shadow:var(--shadow);overflow:hidden}
.pacard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--accent),var(--gold))}
.pacard:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--accent-2)}
.pacard b{font-family:var(--display);font-size:1.05rem}
.pacard.sel{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft),var(--shadow)}
/* record form */
.recgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.recgrid h3.recg{font-size:.95rem;grid-column:1/-1;margin-top:8px;color:var(--accent);border-bottom:2px solid var(--accent-soft);padding-bottom:4px}
.recgrid .wide{grid-column:1/-1}
.recgrid label,.lbl{font-weight:600;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbox{display:inline-flex !important;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);font-weight:500 !important;cursor:pointer;transition:border-color .15s,background .15s}
.chipbox:has(input:checked){border-color:var(--accent-2);background:var(--accent-soft);color:var(--accent)}
.chipbox input{width:16px;height:16px;accent-color:var(--accent)}
.calc{display:grid;gap:6px}
.calc div{display:flex;justify-content:space-between;gap:10px;border-radius:10px;padding:8px 12px;font-size:.9rem;background:var(--surface);border:1px solid var(--line)}
.calc span{color:var(--muted)} .calc b{text-align:right}
.calc .c-ok{background:var(--good-soft);border-color:transparent} .calc .c-ok b{color:var(--good)}
.calc .c-warn{background:var(--warn-soft);border-color:transparent} .calc .c-warn b{color:var(--warn)}
.calc .c-bad{background:var(--bad-soft);border-color:var(--bad)} .calc .c-bad b{color:var(--bad)}
/* checklist */
table.ck{border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.ck td,table.ck th{border:1px solid var(--line)}
table.ck input[type=number]{width:76px;padding:7px;font-weight:700;text-align:center}
table.ck .guide{font-style:italic;color:var(--muted);font-size:.82rem}
.totalbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.totalbar div{background:linear-gradient(180deg,var(--accent-soft),var(--surface));border:1px solid var(--line);border-radius:14px;padding:10px;display:grid}
.totalbar span{font-size:.76rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em} .totalbar b{font-family:var(--display);font-size:1.3rem}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.note{background:var(--gold-soft);border-radius:12px;padding:10px 12px;border-left:4px solid var(--gold)}
img.ev{max-width:100%;max-height:260px;border-radius:14px;border:1px solid var(--line);object-fit:cover;box-shadow:var(--shadow)}
.phone{max-width:320px;margin:0 auto;border:10px solid #1d241e;border-radius:34px;padding:18px 14px;background:var(--surface);display:grid;gap:10px;box-shadow:var(--shadow-lg)}
.screen{background:#14231a;color:#c9f2cf;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;border-radius:12px;padding:12px;min-height:170px;white-space:pre-wrap;box-shadow:inset 0 0 0 1px rgba(201,242,207,.1)}
.coach{background:var(--accent-soft);border-radius:14px;padding:12px;white-space:pre-wrap;border-left:4px solid var(--accent)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;max-width:90vw;z-index:9;box-shadow:var(--shadow-lg)}
.likert{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.likert .opts{display:flex;gap:6px;flex-wrap:wrap}
.likert .opts label{font-weight:500;display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;font-size:.88rem}
.likert .opts label:has(input:checked){border-color:var(--accent-2);background:var(--accent-soft)}
pre.summary{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:var(--body);margin:0}
.taskrow td{background:var(--bg2);color:var(--accent)}.subrow td{font-weight:600;text-align:right;color:var(--muted)}.subrow td:first-child{text-align:right}.oralq{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.mrow{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}.mrow details summary{cursor:pointer}.taskhd{margin-top:14px;padding:8px 12px;border-radius:10px;background:var(--bg2);color:var(--accent);font-weight:700}
.rate{display:flex;gap:6px;flex-wrap:wrap}.rate button{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}.rate button.on.lv0{background:#b42318;border-color:#b42318;color:#fff}.rate button.on.lv1{background:#b54708;border-color:#b54708;color:#fff}.rate button.on.lv2{background:#1e7b3c;border-color:#1e7b3c;color:#fff}
.keylist{list-style:none;padding:0;margin:6px 0;display:grid;gap:4px}.lvdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.lvdot.lv0,.lvtag.lv0{background:#b42318}.lvdot.lv1,.lvtag.lv1{background:#b54708}.lvdot.lv2,.lvtag.lv2{background:#1e7b3c}.lvtag{color:#fff;padding:2px 8px;border-radius:999px;font-size:.8em;white-space:nowrap}
.rclist{display:grid;gap:16px}.rcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;border-top:6px solid #1e7b3c}.rcard.nyc{border-top-color:#b42318}
.rc-head{display:flex;gap:12px;align-items:center;padding:14px 18px;background:linear-gradient(135deg,#0f3d22,#1e7b3c);color:#fff}.rcard.nyc .rc-head{background:linear-gradient(135deg,#4a1410,#8f2a1d)}.rc-head img{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px}.rc-head div{display:grid}.rc-head span{font-size:.8rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.rc-body{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 18px 4px}.rc-who{display:grid;gap:1px;min-width:0}.ring{width:118px;height:118px;flex:none}.rbg{fill:none;stroke:var(--bg2);stroke-width:11}.rfg{fill:none;stroke-width:11;stroke-linecap:round}.rfg.ok{stroke:#1e7b3c}.rfg.nyc{stroke:#b42318}.rpct{font:700 26px system-ui,sans-serif;fill:var(--ink)}.rlbl{font:12px system-ui,sans-serif;fill:var(--muted)}
.rc-decision{margin:10px 18px;padding:10px 14px;border-radius:12px;background:#e7f4ec;color:#14532d;display:grid}.rcard.nyc .rc-decision{background:#fdecea;color:#7a1a12}.rc-decision span{font-weight:800;letter-spacing:.08em}.rc-decision small{font-size:.82rem}
.rc-bars{display:grid;gap:8px;padding:4px 18px 8px}.rc-bar .row b{white-space:nowrap}.rc-bar .row{flex-wrap:nowrap;gap:10px;align-items:flex-start}.rc-bar.sub{padding-left:14px;font-size:.92em;color:var(--muted)}.rc-bar.sub .prog{height:6px}.rc-bar .prog{display:block;width:100%;margin:3px 0 0}.rc-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:8px 18px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.rc-meta dt{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.rc-meta dd{margin:0;font-weight:600}
.rc-fb{margin:8px 18px;padding:10px 14px;border-left:4px solid var(--accent);background:var(--bg2);border-radius:8px}.rc-fb p{margin:4px 0 0}.rc-next{margin:8px 18px;font-size:.92rem}.rc-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:10px 18px;font-size:.75rem;color:var(--muted);background:var(--bg2)}.rc-actions{padding:10px 18px 16px}
.linkbtn{background:none;border:none;box-shadow:none;color:var(--accent);text-decoration:underline;padding:4px 0;font-weight:600}.linkbtn:hover:not(:disabled){background:none;transform:none;box-shadow:none}.fpbox{margin-top:8px}
button.danger{background:#b42318;border-color:#b42318;color:#fff}button.danger:hover:not(:disabled){background:#912018}
.clist{display:grid;gap:8px;max-height:640px;overflow:auto}.crow .chips{margin:6px 0}.chipbox small{font-weight:400}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg2);padding:4px;border-radius:14px}
.subtabs button{background:transparent;color:var(--muted);border:none;box-shadow:none;padding:8px 14px}
.subtabs button:hover:not(:disabled){background:var(--surface);transform:none;box-shadow:none;color:var(--ink)}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
details>summary{cursor:pointer}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:20px;background:linear-gradient(135deg,var(--accent-soft),var(--gold-soft));border:1px solid var(--line);display:grid;gap:6px}
.hero h2{font-size:1.45rem;color:var(--accent)}
.hero .chips span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700;color:var(--muted)}
.role-ico{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:800;margin-right:4px}
.pacard .rhead{display:flex;align-items:center;gap:10px}
footer.foot{text-align:center;color:var(--muted);font-size:.82rem;padding-top:4px}

[hidden]{display:none!important}
@media (max-width:640px){
  table.ck,table.ck tbody{display:block;border:none}
  table.ck thead{display:none}
  table.ck tr{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface);box-shadow:var(--shadow)}
  table.ck td{border:none;padding:0;display:contents}
  table.ck td.ckitem,table.ck td[colspan]{display:block;grid-column:1/-1;font-weight:600}
  table.ck td[data-label]::before{content:attr(data-label);font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  table.ck td[data-label] > *{justify-self:start}
  table.ck td[data-label="Awarded"] .row{grid-column:2}
}
.stepnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.stepnav::-webkit-scrollbar{display:none}
.snav{flex:0 0 auto;background:var(--surface);color:var(--muted);border:1.5px solid var(--line);box-shadow:none;padding:5px 11px;font-size:.82rem;border-radius:999px}
.snav.done{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.snav.now{background:var(--gold-soft);color:#7a4f00;border-color:var(--gold)}
.snav:disabled{opacity:1;cursor:default}
.snav:disabled:not(.now){opacity:.55}
.actionbar{position:sticky;bottom:10px;z-index:3;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(6px);padding:10px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow-lg);justify-content:space-between}
.actionbar button:last-of-type:not(.ghost){flex:1 1 auto}
.privacy{display:grid;gap:2px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px}
.done-card{border-color:var(--good);background:linear-gradient(180deg,var(--good-soft),var(--surface))}
.note-card{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--surface))}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,20,12,.55);display:grid;place-items:end center;padding:12px;backdrop-filter:blur(2px)}
@media (min-width:640px){.modal{place-items:center}}
.modal .sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow-lg)}
.modal .opts{display:grid;gap:8px}
.modal .sheet.poe{width:min(760px,100%)}
.poe h3{margin-top:6px;color:var(--accent)}
.poe-top{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.poe-top img.ev{max-width:120px;max-height:150px}
.poe-res{display:grid;gap:2px;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.poe-res.ok{background:var(--good-soft);border-color:transparent}.poe-res.ok b{color:var(--good)}
.poe-res.nyc{background:var(--bad-soft);border-color:transparent}.poe-res.nyc b{color:var(--bad)}
.poe-res b{font-family:var(--display);font-size:1.3rem}.poe-res span{font-size:.82rem;color:var(--muted)}
.poe th[scope=row]{width:40%;text-transform:none;letter-spacing:0;font-size:.85rem;background:transparent;color:var(--muted)}
ul.vacs{margin:0;padding-left:1.1em;display:grid;gap:4px}
.modal .opts button{width:100%;text-align:left}
.canvaswrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
.canvaswrap canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.skip{position:absolute;left:-999px;top:8px;z-index:30;background:var(--gold);color:#1b1300;padding:8px 14px;border-radius:10px;font-weight:800}
.skip:focus{left:12px}
main:focus{outline:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card,.hero,.tile,.pacard{animation:rise .28s ease-out both}
.palist .pacard:nth-child(2){animation-delay:.03s}.palist .pacard:nth-child(3){animation-delay:.06s}.palist .pacard:nth-child(4){animation-delay:.09s}.palist .pacard:nth-child(5){animation-delay:.12s}
.empty{display:grid;justify-items:center;gap:6px;padding:22px 12px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}
.empty b{font-family:var(--display);font-size:1.6rem;color:var(--accent)}
input:disabled{background:var(--bg);color:var(--muted)}
.scroll:focus-visible,.stepnav:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
